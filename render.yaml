# Render blueprint for the MARG API (FastAPI). Secrets are NOT stored here: Render asks for them in its dashboard (sync: false).
# Heads-up: the backend loads pandas, xgboost, shap and duckdb and warms the budget slider at startup. Render's free plan (512 MB)
# may run out of memory; if the service restarts in a loop, switch `plan` to starter (about $7/month) or deploy to Railway or Fly.
services:
  - type: web
    name: marg-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL            # Supabase "Session pooler" URI (see .env.example)
        sync: false
      - key: ANTHROPIC_API_KEY       # Claude answers and notices; without it the API serves filled templates
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID       # photo uploads; without these, photos go to a disk that Render wipes on every deploy
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_SESSION_HOURS
        value: "12"
